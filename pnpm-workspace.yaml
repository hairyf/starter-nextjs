catalogMode: prefer

ignoreWorkspaceRootCheck: true

shellEmulator: true
trustPolicy: no-downgrade - esbuild - simple-git-hooks

packages:
  - playground
  - docs
  - packages/*
  - examples/*
catalog:
  '@eslint-react/eslint-plugin': ^2.8.1
  '@next/eslint-plugin-next': ^16.1.6
  '@types/react': ^19.2.10
  '@types/react-dom': ^19.2.3
  eslint-plugin-react-hooks: ^7.0.1
  eslint-plugin-react-refresh: ^0.4.26
  next: ^16.1.6
  react: ^19.2.4
  react-dom: ^19.2.4
  skills: ^1.3.1
  skills-manifest: ^0.2.1

catalogs:
  cli:
    '@antfu/eslint-config': ^7.2.0
    '@antfu/ni': ^28.0.0
    eslint: ^9.39.2
    lint-staged: ^16.2.7
    simple-git-hooks: ^2.13.1
    tsx: ^4.21.0
    typescript: ^5.9.3
    vite: ^7.2.7
  testing:
    tinyexec: ^1.0.2
    vitest: ^4.0.15
    vitest-package-exports: ^0.1.1
    yaml: ^2.8.2
  types:
    '@types/node': ^25.0.1

onlyBuiltDependencies:
  - esbuild
  - simple-git-hooks
